document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 99 3>\n        <p style=\"margin: 0; color: var(--t-ink2, #645c50); font-size: 16px;\">Puck kurz ans Handy. Der Modus startet — Lernen, Arbeiten, Klettern. Du gibst jedem Puck seinen Namen.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background: var(--t-surface, #fffaf1); border: 1px solid var(--t-line, rgba(32,30,29,.09)); border-radius: 28px; padding: 32px 30px 34px; box-shadow: var(--t-card-sh, 0 18px 40px rgba(46,43,37,.12), 0 2px 6px rgba(46,43,37,.06)); transition: transform .22s ease, box-shadow .22s ease;\" style-hover=\"transform: translateY(-6px); box-shadow: var(--t-card-sh-h, 0 30px 60px rgba(46,43,37,.18), 0 4px 10px rgba(46,43,37,.09));\">\n        <div style=\"width: 46px; height: 46px; border-radius: 50%; background: var(--t-chip, rgba(198,113,57,.14)); color: var(--t-accent, #8c491a); font-family: 'Caprasimo', system-ui, sans-serif; font-size: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;\">2<\u002Fdiv>\n        <h3 style=\"font-size: 1.22rem; font-weight: 700; margin: 0 0 8px;\">Arbeiten<\u002Fh3>\n        <p style=\"margin: 0; color: var(--t-ink2, #645c50); font-size: 16px;\">Die Apps, die du ausgewählt hast, sind gesperrt. Öffnest du eine, kommt ein Sperrbildschirm statt der Startseite.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background: var(--t-surface, #fffaf1); border: 1px solid var(--t-line, rgba(32,30,29,.09)); border-radius: 28px; padding: 32px 30px 34px; box-shadow: var(--t-card-sh, 0 18px 40px rgba(46,43,37,.12), 0 2px 6px rgba(46,43,37,.06)); transition: transform .22s ease, box-shadow .22s ease;\" style-hover=\"transform: translateY(-6px); box-shadow: var(--t-card-sh-h, 0 30px 60px rgba(46,43,37,.18), 0 4px 10px rgba(46,43,37,.09));\">\n        <div style=\"width: 46px; height: 46px; border-radius: 50%; background: var(--t-chip, rgba(198,113,57,.14)); color: var(--t-accent, #8c491a); font-family: 'Caprasimo', system-ui, sans-serif; font-size: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;\">3<\u002Fdiv>\n        <h3 style=\"font-size: 1.22rem; font-weight: 700; margin: 0 0 8px;\">Nochmal antippen<\u002Fh3>\n        <p style=\"margin: 0; color: var(--t-ink2, #645c50); font-size: 16px;\">Fertig. Der Block wird gebucht, mit Anfang, Ende und Dauer. Die Wochenlinie wächst.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1120px; margin: 0 auto; padding: 78px 24px;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 56px; align-items: center;\">\n      <div style=\"display: flex; justify-content: center;\" data-reveal=\"\">\n        <div style=\"width: 306px; max-width: 100%; background: #16140f; border: 10px solid #16140f; border-radius: 44px; box-shadow: var(--t-phone-sh, 0 34px 70px rgba(46,43,37,.28), 0 6px 14px rgba(46,43,37,.18)); overflow: hidden;\">\n          <div style=\"background: #201e1d; color: #f9f4ed; border-radius: 34px; padding: 18px 16px 0; font-size: 14px;\">\n            <div style=\"display: flex; justify-content: space-between; font-size: 11px; color: #9a9081; padding: 0 6px 12px;\"><span>9:41<\u002Fspan><span>NFC ●<\u002Fspan><\u002Fdiv>\n            <p style=\"font-family: 'Caprasimo', system-ui, sans-serif; font-weight: 400; font-size: 22px; margin: 0 0 16px; padding: 0 6px;\">Heute<\u002Fp>\n\n            <div style=\"background: #2e2b25; border-radius: 20px; padding: 16px 16px 18px; margin-bottom: 10px; box-shadow: inset 0 1px 0 rgba(255,255,255,.05);\">\n              <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 10px;\">\n                <span style=\"width: 9px; height: 9px; border-radius: 50%; background: #c67139; box-shadow: 0 0 0 5px rgba(246,160,107,.16);\"><\u002Fspan>\n                <span style=\"font-weight: 600; font-size: 14px;\">Lernen<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"font-family: ui-monospace, Menlo, monospace; font-size: 28px; font-weight: 600; margin: 0; letter-spacing: -.02em;\">1:12:44<\u002Fp>\n              <p style=\"margin: 5px 0 0; font-size: 11.5px; color: #9a9081;\">seit 06:00 · 6 Apps gesperrt<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"background: #262320; border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;\">\n              <p style=\"margin: 0 0 3px; font-size: 11px; color: #9a9081;\">Gesamt heute<\u002Fp>\n              <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 600;\">3 h 25 min · 4 Blöcke<\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"background: #262320; border-radius: 16px; padding: 13px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 9px;\">\n              <span style=\"width: 8px; height: 8px; border-radius: 50%; background: #aebf92;\"><\u002Fspan>\n              <span style=\"font-size: 13.5px;\">Arbeiten<\u002Fspan>\n              <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; font-weight: 600; margin-left: auto; color: #c0b6a5;\">1 h 50 min<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background: #262320; border-radius: 16px; padding: 13px 14px; display: flex; align-items: center; gap: 9px;\">\n              <span style=\"width: 8px; height: 8px; border-radius: 50%; background: #d67f48;\"><\u002Fspan>\n              <span style=\"font-size: 13.5px;\">Klettern<\u002Fspan>\n              <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; font-weight: 600; margin-left: auto; color: #c0b6a5;\">25 min<\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; border-top: 1px solid rgba(249,244,237,.1); margin: 16px -16px 0; padding: 10px 0 14px;\">\n              <div style=\"flex: 1; text-align: center; font-size: 11px; font-weight: 600; color: #f9f4ed;\"><div style=\"width: 5px; height: 5px; border-radius: 50%; background: #c67139; margin: 0 auto 5px;\"><\u002Fdiv>Heute<\u002Fdiv>\n              <div style=\"flex: 1; text-align: center; font-size: 11px; color: #82796a; padding-top: 10px;\">Statistik<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\">\n        <p style=\"font-size: 12px; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; color: var(--t-muted, #82796a); margin: 0 0 14px;\">Die App<\u002Fp>\n        <h2 style=\"font-family: 'Caprasimo', system-ui, sans-serif; font-weight: 400; font-size: clamp(1.8rem, 3.2vw, 2.6rem); line-height: 1.12; letter-spacing: -.015em; margin: 0 0 20px;\">Zählt mit, ohne dass du etwas eintippst.<\u002Fh2>\n        <p style=\"color: var(--t-ink2, #645c50); margin: 0 0 16px; max-width: 32rem;\">Jeder Block landet im Logbuch: welcher Modus, wann, wie lange. Nach ein paar Tagen siehst du im Verlauf, an welchen Tagen du wirklich gearbeitet hast und an welchen du es dir nur vorgenommen hattest.<\u002Fp>\n        <p style=\"color: var(--t-ink2, #645c50); margin: 0 0 26px; max-width: 32rem;\">Das ist der Unterschied zu einer reinen Sperre: Die hört auf, wo es interessant wird.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px;\">\n          <span style=\"font-size: 13px; font-weight: 600; padding: 8px 15px; border-radius: 999px; background: var(--t-chip, rgba(198,113,57,.14)); color: var(--t-accent, #8c491a);\">Kein Konto<\u002Fspan>\n          <span style=\"font-size: 13px; font-weight: 600; padding: 8px 15px; border-radius: 999px; background: var(--t-chip2, rgba(122,138,94,.18)); color: var(--t-accent2, #56633f);\">Keine Internet-Berechtigung<\u002Fspan>\n          <span style=\"font-size: 13px; font-weight: 600; padding: 8px 15px; border-radius: 999px; background: var(--t-chip2, rgba(122,138,94,.18)); color: var(--t-accent2, #56633f);\">Alles bleibt auf dem Gerät<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"background: var(--t-band-bg, #f9f4ed); color: var(--t-band-ink, #201e1d); border-top: 1px solid var(--t-band-line, rgba(32,30,29,.1)); border-bottom: 1px solid var(--t-band-line, rgba(32,30,29,.1));\">\n    <section style=\"max-width: 1120px; margin: 0 auto; padding: 82px 24px;\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 48px; align-items: start; margin-bottom: 52px;\">\n        <div data-reveal=\"\">\n          <p style=\"font-size: 12px; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; color: var(--t-band-muted, #82796a); margin: 0 0 14px;\">Der Puck<\u002Fp>\n          <h2 style=\"font-family: 'Caprasimo', system-ui, sans-serif; font-weight: 400; font-size: clamp(1.9rem, 3.6vw, 2.9rem); line-height: 1.1; letter-spacing: -.015em; margin: 0 0 20px;\">40 Millimeter, flach, magnetisch.<\u002Fh2>\n          <p style=\"color: var(--t-band-ink2, #645c50); margin: 0; max-width: 32rem;\">Keine Batterie, nichts zu laden. Er liegt auf dem Tisch oder hängt an der Lampe und wartet darauf, angetippt zu werden.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"background: var(--t-band-surface, #ffffff); border: 1px solid var(--t-band-line, rgba(32,30,29,.08)); border-radius: 28px; padding: 26px 30px; box-shadow: var(--t-card-sh, 0 18px 40px rgba(46,43,37,.12), 0 2px 6px rgba(46,43,37,.06));\">\n          <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n            <div style=\"display: flex; gap: 12px; align-items: baseline;\"><span style=\"flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--t-accent-bright, #c67139); margin-top: 8px;\"><\u002Fspan><p style=\"margin: 0; color: var(--t-band-ink2, #645c50); font-size: 16px;\"><strong style=\"color: var(--t-band-ink, #201e1d);\">40 mm<\u002Fstrong> flach, 3D-gedruckt in der Schweiz<\u002Fp><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px; align-items: baseline;\"><span style=\"flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--t-accent-bright, #c67139); margin-top: 8px;\"><\u002Fspan><p style=\"margin: 0; color: var(--t-band-ink2, #645c50); font-size: 16px;\"><strong style=\"color: var(--t-band-ink, #201e1d);\">Magnetisch<\u002Fstrong> — hält an der Lampe, am Regal, am Werkzeugkoffer<\u002Fp><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px; align-items: baseline;\"><span style=\"flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--t-accent-bright, #c67139); margin-top: 8px;\"><\u002Fspan><p style=\"margin: 0; color: var(--t-band-ink2, #645c50); font-size: 16px;\"><strong style=\"color: var(--t-band-ink, #201e1d);\">NFC eingebaut<\u002Fstrong>, keine Batterie, nichts zu laden<\u002Fp><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px; align-items: baseline;\"><span style=\"flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--t-accent-bright, #c67139); margin-top: 8px;\"><\u002Fspan><p style=\"margin: 0; color: var(--t-band-ink2, #645c50); font-size: 16px;\"><strong style=\"color: var(--t-band-ink, #201e1d);\">App gratis<\u002Fstrong>, so viele Modi wie du willst, keine Bezahlfunktionen<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"background: var(--t-band-surface, #ffffff); border: 1px solid var(--t-band-line, rgba(32,30,29,.08)); border-radius: 28px; padding: 18px 18px 12px; margin-bottom: 20px; box-shadow: var(--t-card-sh, 0 18px 40px rgba(46,43,37,.12), 0 2px 6px rgba(46,43,37,.06));\">\n        <model-viewer src=\"uploads/modus-puck.glb\" alt=\"Modus-Puck, 40 Millimeter, zum Drehen\" camera-controls=\"\" touch-action=\"pan-y\" auto-rotate=\"\" auto-rotate-delay=\"600\" rotation-per-second=\"16deg\" camera-orbit=\"30deg 118deg auto\" camera-target=\"0m 0.004m 0m\" environment-image=\"neutral\" exposure=\"1.15\" shadow-intensity=\"1.1\" shadow-softness=\"0.9\" interaction-prompt=\"none\" style=\"width: 100%; height: clamp(300px, 44vw, 460px); display: block; background: transparent; cursor: grab; --poster-color: transparent; --progress-bar-color: #c67139;\">\n          <div slot=\"poster\" style=\"width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;\">\n            <div style=\"position: relative; width: 62%; max-width: 300px; aspect-ratio: 1; border-radius: 50%; background: var(--t-puck, radial-gradient(circle at 34% 26%, #39444e 0%, #262f37 42%, #1a2229 74%, #12181d 100%)); box-shadow: var(--t-puck-sh, 0 30px 60px rgba(0,0,0,.4));\">\n              <div style=\"position: absolute; inset: 11%; border-radius: 50%; background: var(--t-puck-face, radial-gradient(circle at 38% 30%, #333d46 0%, #232b33 55%, #1a2027 100%));\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fmodel-viewer>\n        <p style=\"text-align: center; font-size: 13px; letter-spacing: .04em; color: var(--t-band-muted, #82796a); margin: 6px 0 0;\">Ziehen zum Drehen · Mausrad oder zwei Finger zum Zoomen<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px;\">\n        <div data-reveal=\"\" style=\"aspect-ratio: 4 / 3; border: 2px dashed var(--t-dash, rgba(32,30,29,.22)); border-radius: 24px; background: var(--t-slot, rgba(255,255,255,.5)); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 22px; gap: 7px;\">\n          <span style=\"font-family: 'Caprasimo', system-ui, sans-serif; font-size: 17px; color: var(--t-band-ink, #201e1d);\">Foto 1<\u002Fspan>\n          <span style=\"font-size: 13.5px; color: var(--t-band-muted, #82796a); max-width: 18rem;\">Puck in der Hand, vor unscharfem Hintergrund. Zeigt die Grösse.<\u002Fspan>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"aspect-ratio: 4 / 3; border: 2px dashed var(--t-dash, rgba(32,30,29,.22)); border-radius: 24px; background: var(--t-slot, rgba(255,255,255,.5)); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 22px; gap: 7px;\">\n          <span style=\"font-family: 'Caprasimo', system-ui, sans-serif; font-size: 17px; color: var(--t-band-ink, #201e1d);\">Foto 2<\u002Fspan>\n          <span style=\"font-size: 13.5px; color: var(--t-band-muted, #82796a); max-width: 18rem;\">Puck am Handy, im Moment des Antippens.<\u002Fspan>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"aspect-ratio: 4 / 3; border: 2px dashed var(--t-dash, rgba(32,30,29,.22)); border-radius: 24px; background: var(--t-slot, rgba(255,255,255,.5)); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 22px; gap: 7px;\">\n          <span style=\"font-family: 'Caprasimo', system-ui, sans-serif; font-size: 17px; color: var(--t-band-ink, #201e1d);\">Foto 3<\u002Fspan>\n          <span style=\"font-size: 13.5px; color: var(--t-band-muted, #82796a); max-width: 18rem;\">Drei Pucks auf dem Schreibtisch oder magnetisch an der Lampe.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <section style=\"max-width: 1120px; margin: 0 auto; padding: 82px 24px 0;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px;\">\n      <div data-reveal=\"\" style=\"background: var(--t-surface, #fffaf1); border: 1px solid var(--t-line, rgba(32,30,29,.09)); border-radius: 28px; padding: 38px 36px; box-shadow: var(--t-card-sh, 0 18px 40px rgba(46,43,37,.12), 0 2px 6px rgba(46,43,37,.06));\">\n        <p style=\"font-size: 12px; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; color: var(--t-muted, #82796a); margin: 0 0 16px;\">Warum ein Gegenstand<\u002Fp>\n        <p style=\"color: var(--t-ink2, #645c50); margin: 0 0 14px;\">Eine App zu öffnen, um sich zu konzentrieren, ist ein Widerspruch. Der Puck liegt einfach da. Ihn anzutippen kostet eine Sekunde und ist eine Entscheidung, die du mit der Hand triffst — kein Menü, keine Einstellung.<\u002Fp>\n        <p style=\"color: var(--t-ink2, #645c50); margin: 0;\">Und rein digitale Sperren wischt man weg. Die meisten Fokus-Apps werden installiert und liegen nach zwei Wochen brach. Etwas, das man anfassen muss, ist schwerer zu ignorieren als ein Knopf im Menü.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background: var(--t-surface-alt, #ebddc5); border: 1px solid var(--t-line, rgba(32,30,29,.09)); border-radius: 28px; padding: 38px 36px; box-shadow: var(--t-card-sh, 0 18px 40px rgba(46,43,37,.12), 0 2px 6px rgba(46,43,37,.06));\">\n        <p style=\"font-size: 12px; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; color: var(--t-muted, #82796a); margin: 0 0 16px;\">Was es nicht macht<\u002Fp>\n        <p style=\"font-family: 'Caprasimo', system-ui, sans-serif; font-weight: 400; font-size: 1.5rem; line-height: 1.25; margin: 0 0 16px;\">Kein Konto. Keine Registrierung. Kein Abo. Keine Werbung. Kein Tracking.<\u002Fp>\n        <p style=\"color: var(--t-ink2, #645c50); margin: 0;\">Die App hat <strong style=\"color: var(--t-ink, #201e1d);\">keine Internet-Berechtigung<\u002Fstrong> — sie kann technisch nichts senden. Alles, was du aufzeichnest, bleibt auf deinem Gerät. Das ist keine Zusage, sondern im Programm nachprüfbar.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1120px; margin: 0 auto; padding: 78px 24px;\">\n    <div style=\"max-width: 40rem; margin-bottom: 36px;\" data-reveal=\"\">\n      <p style=\"font-size: 12px; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; color: var(--t-muted, #82796a); margin: 0 0 14px;\">Preise<\u002Fp>\n      <h2 style=\"font-family: 'Caprasimo', system-ui, sans-serif; font-weight: 400; font-size: clamp(1.9rem, 3.6vw, 2.9rem); line-height: 1.1; letter-spacing: -.015em; margin: 0;\">Einmal zahlen. Dann liegt er da.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 24px; align-items: stretch;\">\n      <div data-reveal=\"\" style=\"background: var(--t-surface, #fffaf1); border: 1px solid var(--t-line, rgba(32,30,29,.09)); border-radius: 28px; padding: 34px 32px; box-shadow: var(--t-card-sh, 0 18px 40px rgba(46,43,37,.12), 0 2px 6px rgba(46,43,37,.06)); transition: transform .22s ease, box-shadow .22s ease;\" style-hover=\"transform: translateY(-5px); box-shadow: var(--t-card-sh-h, 0 30px 60px rgba(46,43,37,.18), 0 4px 10px rgba(46,43,37,.09));\">\n        <p style=\"margin: 0 0 12px; font-size: 15px; color: var(--t-ink2, #645c50); font-weight: 600;\">Einzelner Puck<\u002Fp>\n        <p style=\"font-family: 'Caprasimo', system-ui, sans-serif; font-weight: 400; font-size: 3rem; line-height: 1; margin: 0 0 12px;\">14 <span style=\"font-size: 1.2rem; color: var(--t-muted, #82796a);\">CHF<\u002Fspan><\u002Fp>\n        <p style=\"margin: 0; color: var(--t-ink2, #645c50); font-size: 15.5px;\">Zum Ausprobieren. Ein Modus reicht für den Anfang.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"position: relative; background: var(--t-accent-fill, #8c491a); color: #fff9f2; border-radius: 28px; padding: 34px 32px; box-shadow: var(--t-accent-sh, 0 24px 52px rgba(140,73,26,.32), 0 3px 10px rgba(46,43,37,.14)); transition: transform .22s ease, box-shadow .22s ease;\" style-hover=\"transform: translateY(-5px); box-shadow: var(--t-accent-sh-h, 0 34px 66px rgba(140,73,26,.4), 0 4px 12px rgba(46,43,37,.18));\">\n        <span style=\"position: absolute; top: 26px; right: 28px; font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; background: rgba(255,249,242,.2); padding: 6px 12px; border-radius: 999px;\">Beliebt<\u002Fspan>\n        <p style=\"margin: 0 0 12px; font-size: 15px; font-weight: 600; opacity: .85;\">Set mit 3 Pucks<\u002Fp>\n        <p style=\"font-family: 'Caprasimo', system-ui, sans-serif; font-weight: 400; font-size: 3rem; line-height: 1; margin: 0 0 12px;\">29 <span style=\"font-size: 1.2rem; opacity: .75;\">CHF<\u002Fspan><\u002Fp>\n        <p style=\"margin: 0 0 22px; font-size: 15.5px; opacity: .9;\">9.70 pro Puck. Drei Modi — Arbeit, Lernen, Sport.<\u002Fp>\n        <a href=\"mailto:tagfokus4@gmail.com?subject=Vorbestellung%20Tag%20und%20Fokus&amp;body=Set%20mit%203%20Pucks%20(29%20CHF)%0A%0AName%3A%0AOrt%3A%0AAndroid-Handy%3A%20ja%20%2F%20nein\" style=\"display: inline-block; text-decoration: none; font-weight: 700; font-size: 15.5px; padding: 14px 28px; border-radius: 999px; background: #fff9f2; color: var(--t-accent-fill, #8c491a); transition: transform .18s ease;\" style-hover=\"transform: translateY(-2px);\">Set vorbestellen<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1120px; margin: 0 auto; padding: 0 24px 78px;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 44px;\">\n      <div data-reveal=\"\">\n        <p style=\"font-size: 12px; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; color: var(--t-muted, #82796a); margin: 0 0 14px;\">Ehrlich: wo das steht<\u002Fp>\n        <p style=\"color: var(--t-ink2, #645c50); margin: 0 0 14px;\">Tag &amp; Fokus wird von einer Person neben dem Beruf gebaut. Die App läuft, die Pucks sind entworfen, gedruckt und getestet. Was noch fehlt, ist die Serie und der Versand.<\u002Fp>\n        <p style=\"color: var(--t-ink2, #645c50); margin: 0;\">Vorbestellen heisst deshalb: kein Geld, keine Verpflichtung. Du schreibst eine Mail, und du hörst wieder von mir, sobald die ersten Sets fertig sind. Wie viele Leute sich melden, entscheidet mit, ob und wann das passiert.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\">\n        <p style=\"font-size: 12px; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; color: var(--t-muted, #82796a); margin: 0 0 14px;\">Was du brauchst<\u002Fp>\n        <p style=\"color: var(--t-ink2, #645c50); margin: 0 0 14px;\">Ein <strong style=\"color: var(--t-ink, #201e1d);\">Android-Handy mit NFC<\u002Fstrong>. Das haben fast alle Geräte der letzten Jahre.<\u002Fp>\n        <p style=\"color: var(--t-ink2, #645c50); margin: 0;\">Für das iPhone gibt es die App noch nicht — Apple erlaubt das Sperren fremder Apps nur unter Auflagen. Falls sich das ändert, steht es hier.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"background: var(--t-band-bg, #f9f4ed); color: var(--t-band-ink, #201e1d); border-top: 1px solid var(--t-band-line, rgba(32,30,29,.1)); position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; left: 50%; top: -180px; width: 520px; height: 520px; margin-left: -260px; border-radius: 50%; background: var(--t-blob, rgba(198,113,57,.14)); pointer-events: none;\"><\u002Fdiv>\n    <section style=\"max-width: 760px; margin: 0 auto; padding: 96px 24px 84px; text-align: center; position: relative;\" data-reveal=\"\">\n      <h2 style=\"font-family: 'Caprasimo', system-ui, sans-serif; font-weight: 400; font-size: clamp(2rem, 4.4vw, 3.2rem); line-height: 1.08; letter-spacing: -.02em; margin: 0 0 28px; text-wrap: balance;\">Ein Puck, drei Sekunden, und der Tag ist gezählt.<\u002Fh2>\n      <a href=\"mailto:tagfokus4@gmail.com?subject=Vorbestellung%20Tag%20und%20Fokus&amp;body=Ich%20m%C3%B6chte%20vorbestellen.%0A%0ASet%20mit%203%20Pucks%20(29%20CHF)%20oder%20einzelner%20Puck%20(14%20CHF)%3A%0A%0AName%3A%0AOrt%3A%0AAndroid-Handy%3A%20ja%20%2F%20nein\" style=\"display: inline-block; text-decoration: none; font-weight: 700; font-size: 17.5px; padding: 18px 38px; border-radius: 999px; background: var(--t-band-btn-bg, #d67f48); color: var(--t-band-btn-ink, #2b1608); box-shadow: 0 12px 28px var(--t-btn-glow, rgba(140,73,26,.32)); transition: transform .18s ease, box-shadow .18s ease;\" style-hover=\"transform: translateY(-3px); box-shadow: 0 20px 40px var(--t-btn-glow, rgba(140,73,26,.38));\" style-active=\"transform: translateY(-1px);\">Vorbestellen<\u002Fa>\n      <p style=\"margin: 20px 0 0; font-size: 15.5px; color: var(--t-band-ink2, #645c50);\"><strong style=\"color: var(--t-band-ink, #201e1d);\">29 CHF<\u002Fstrong> fürs Set · einzeln <strong style=\"color: var(--t-band-ink, #201e1d);\">14 CHF<\u002Fstrong><\u002Fp>\n      <p style=\"margin: 4px 0 0; font-size: 13.5px; color: var(--t-band-muted, #82796a);\">Ohne Zahlung, ohne Verpflichtung.<\u002Fp>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <footer style=\"max-width: 1120px; margin: 0 auto; padding: 38px 24px 56px; display: flex; flex-wrap: wrap; gap: 14px 32px; justify-content: space-between; font-size: 14.5px; color: var(--t-muted, #82796a);\">\n    <p style=\"margin: 0;\">Tag &amp; Fokus · Valerio Da Mocogno · Schweiz<\u002Fp>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 22px;\">\n      <a href=\"mailto:tagfokus4@gmail.com\" style=\"color: var(--t-accent, #8c491a); text-decoration: none; border-bottom: 1px solid var(--t-dash, rgba(32,30,29,.22));\">tagfokus4@gmail.com<\u002Fa>\n      <a href=\"https://tagfokus4-create.github.io/tagundfokus/\" style=\"color: var(--t-accent, #8c491a); text-decoration: none; border-bottom: 1px solid var(--t-dash, rgba(32,30,29,.22));\">Datenschutzerklärung<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<div style=\"position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 50; display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgba(32,30,29,.86); backdrop-filter: blur(10px); box-shadow: 0 14px 34px rgba(0,0,0,.3); font-family: 'Figtree', system-ui, sans-serif;\">\n  <button type=\"button\" sc-camel-on-click=\"{{ pickWarm }}\" style=\"{{ tabWarm }}\">Warm<\u002Fbutton>\n  <button type=\"button\" sc-camel-on-click=\"{{ pickDunkel }}\" style=\"{{ tabDunkel }}\">Dunkel<\u002Fbutton>\n  <button type=\"button\" sc-camel-on-click=\"{{ pickDuo }}\" style=\"{{ tabDuo }}\">Zweifarbig<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;warm&quot;,&quot;dunkel&quot;,&quot;duo&quot;],&quot;default&quot;:&quot;duo&quot;,&quot;tsType&quot;:&quot;'warm'|'dunkel'|'duo'&quot;,&quot;section&quot;:&quot;Richtung&quot;}}\">\nconst THEMES = {\n  warm: {\n    '--t-bg': '#f5ead8', '--t-surface': '#fffaf1', '--t-surface-alt': '#ebddc5',\n    '--t-ink': '#201e1d', '--t-ink2': '#645c50', '--t-muted': '#82796a',\n    '--t-line': 'rgba(32,30,29,.09)', '--t-dash': 'rgba(32,30,29,.22)',\n    '--t-slot': 'rgba(255,255,255,.55)',\n    '--t-accent': '#8c491a', '--t-accent2': '#56633f', '--t-accent-bright': '#c67139',\n    '--t-chip': 'rgba(198,113,57,.14)', '--t-chip2': 'rgba(122,138,94,.18)',\n    '--t-blob': 'rgba(198,113,57,.14)',\n    '--t-btn-glow': 'rgba(140,73,26,.28)',\n    '--t-card-sh': '0 18px 40px rgba(46,43,37,.12), 0 2px 6px rgba(46,43,37,.06)',\n    '--t-card-sh-h': '0 30px 60px rgba(46,43,37,.18), 0 4px 10px rgba(46,43,37,.09)',\n    '--t-accent-fill': '#8c491a',\n    '--t-accent-sh': '0 24px 52px rgba(140,73,26,.32), 0 3px 10px rgba(46,43,37,.14)',\n    '--t-accent-sh-h': '0 34px 66px rgba(140,73,26,.4), 0 4px 12px rgba(46,43,37,.18)',\n    '--t-phone-sh': '0 34px 70px rgba(46,43,37,.26), 0 6px 14px rgba(46,43,37,.16)',\n    '--t-puck': 'radial-gradient(circle at 34% 26%, #e8d7bd 0%, #d9c3a2 44%, #bda483 76%, #9c8465 100%)',\n    '--t-puck-face': 'radial-gradient(circle at 38% 30%, #f2e6d1 0%, #e0cdb0 55%, #c9b190 100%)',\n    '--t-puck-fuge': 'rgba(90,70,50,.35)', '--t-puck-inner': 'rgba(90,70,50,.28)',\n    '--t-puck-sh': '0 30px 60px rgba(46,43,37,.3), 0 6px 16px rgba(46,43,37,.2), inset 0 2px 0 rgba(255,255,255,.55)',\n    '--t-puck-ground': 'rgba(46,43,37,.18)',\n    '--t-band-bg': '#f9f4ed', '--t-band-surface': '#ffffff', '--t-band-ink': '#201e1d',\n    '--t-band-ink2': '#645c50', '--t-band-muted': '#82796a', '--t-band-line': 'rgba(32,30,29,.1)',\n    '--t-band-accent': '#8c491a', '--t-band-btn-bg': '#a95a20', '--t-band-btn-ink': '#fff9f2'\n  },\n  dunkel: {\n    '--t-bg': '#1a1817', '--t-surface': '#262320', '--t-surface-alt': '#2e2b25',\n    '--t-ink': '#f9f4ed', '--t-ink2': '#c0b6a5', '--t-muted': '#9a9081',\n    '--t-line': 'rgba(249,244,237,.11)', '--t-dash': 'rgba(249,244,237,.24)',\n    '--t-slot': 'rgba(249,244,237,.04)',\n    '--t-accent': '#f6a06b', '--t-accent2': '#aebf92', '--t-accent-bright': '#f6a06b',\n    '--t-chip': 'rgba(246,160,107,.16)', '--t-chip2': 'rgba(174,191,146,.16)',\n    '--t-blob': 'rgba(214,127,72,.18)',\n    '--t-btn-glow': 'rgba(0,0,0,.5)',\n    '--t-card-sh': '0 22px 46px rgba(0,0,0,.42), 0 2px 6px rgba(0,0,0,.3)',\n    '--t-card-sh-h': '0 34px 64px rgba(0,0,0,.55), 0 4px 10px rgba(0,0,0,.35)',\n    '--t-accent-fill': '#b2622d',\n    '--t-accent-sh': '0 26px 54px rgba(0,0,0,.45), 0 3px 10px rgba(0,0,0,.3)',\n    '--t-accent-sh-h': '0 36px 68px rgba(0,0,0,.55), 0 4px 12px rgba(0,0,0,.35)',\n    '--t-phone-sh': '0 36px 72px rgba(0,0,0,.55), 0 6px 14px rgba(0,0,0,.4)',\n    '--t-puck': 'radial-gradient(circle at 34% 26%, #5a4e42 0%, #43392f 44%, #2f2822 76%, #211c18 100%)',\n    '--t-puck-face': 'radial-gradient(circle at 38% 30%, #6a5b4c 0%, #4b4036 55%, #342c25 100%)',\n    '--t-puck-fuge': 'rgba(0,0,0,.5)', '--t-puck-inner': 'rgba(0,0,0,.45)',\n    '--t-puck-sh': '0 34px 64px rgba(0,0,0,.6), 0 6px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.1)',\n    '--t-puck-ground': 'rgba(0,0,0,.5)',\n    '--t-band-bg': '#201e1d', '--t-band-surface': '#2e2b25', '--t-band-ink': '#f9f4ed',\n    '--t-band-ink2': '#c0b6a5', '--t-band-muted': '#9a9081', '--t-band-line': 'rgba(249,244,237,.1)',\n    '--t-band-accent': '#f6a06b', '--t-band-btn-bg': '#d67f48', '--t-band-btn-ink': '#2b1608'\n  }\n};\nTHEMES.duo = Object.assign({}, THEMES.warm, {\n  '--t-band-bg': '#201e1d', '--t-band-surface': '#2e2b25', '--t-band-ink': '#f9f4ed',\n  '--t-band-ink2': '#c0b6a5', '--t-band-muted': '#9a9081', '--t-band-line': 'rgba(249,244,237,.12)',\n  '--t-band-accent': '#f6a06b', '--t-band-btn-bg': '#d67f48', '--t-band-btn-ink': '#2b1608',\n  '--t-blob': 'rgba(214,127,72,.2)', '--t-btn-glow': 'rgba(0,0,0,.4)',\n  '--t-dash': 'rgba(249,244,237,.24)', '--t-slot': 'rgba(249,244,237,.04)',\n  '--t-accent-bright': '#f6a06b',\n  '--t-puck': 'radial-gradient(circle at 34% 26%, #5a4e42 0%, #43392f 44%, #2f2822 76%, #211c18 100%)',\n  '--t-puck-face': 'radial-gradient(circle at 38% 30%, #6a5b4c 0%, #4b4036 55%, #342c25 100%)',\n  '--t-puck-fuge': 'rgba(0,0,0,.5)', '--t-puck-inner': 'rgba(0,0,0,.45)',\n  '--t-puck-sh': '0 34px 64px rgba(0,0,0,.6), 0 6px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.1)',\n  '--t-puck-ground': 'rgba(0,0,0,.5)',\n  '--t-phone-sh': '0 36px 72px rgba(0,0,0,.5), 0 6px 14px rgba(0,0,0,.35)'\n});\n\nconst TAB = 'border: 0; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; padding: 9px 18px; border-radius: 999px; transition: background .18s ease, color .18s ease;';\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { variant: props.variant || 'duo' };\n  }\n  componentDidMount() {\n    this.reveal = this.reveal.bind(this);\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    this.hidden = [];\n    document.querySelectorAll('[data-reveal]').forEach((n) => {\n      n.style.opacity = '0';\n      this.hidden.push(n);\n    });\n    // Safety net: whatever happens with observers or scrolling, everything\n    // becomes visible on its own.\n    // Environments with a frozen animation clock get everything at once.\n    const t0 = document.timeline && document.timeline.currentTime;\n    setTimeout(() => {\n      const t1 = document.timeline && document.timeline.currentTime;\n      if (!(t1 > t0)) this.revealAll();\n    }, 320);\n    this.timer = setTimeout(() => this.revealAll(), 2200);\n    window.addEventListener('scroll', this.reveal, { passive: true });\n    window.addEventListener('resize', this.reveal, { passive: true });\n    requestAnimationFrame(() => this.reveal());\n  }\n  reveal() {\n    if (!this.hidden || !this.hidden.length) return;\n    const h = window.innerHeight || 800;\n    this.hidden = this.hidden.filter((n) => {\n      const top = n.getBoundingClientRect().top;\n      if (top > h * 0.94) return true;\n      this.show(n);\n      return false;\n    });\n    if (!this.hidden.length) this.cleanup();\n  }\n  revealAll() {\n    if (this.hidden) this.hidden.forEach((n) => this.show(n));\n    this.hidden = [];\n    this.cleanup();\n  }\n  show(n) {\n    n.style.opacity = '1';\n    n.style.animation = 'tf-rise .7s cubic-bezier(.2,.7,.2,1)';\n    setTimeout(() => { n.style.animation = ''; n.style.opacity = '1'; n.style.transform = 'none'; }, 900);\n  }\n  cleanup() {\n    clearTimeout(this.timer);\n    window.removeEventListener('scroll', this.reveal);\n    window.removeEventListener('resize', this.reveal);\n  }\n  componentWillUnmount() { this.cleanup(); }\n  tab(key, label) {\n    const on = this.state.variant === key;\n    return TAB + (on\n      ? 'background: #c67139; color: #2b1608;'\n      : 'background: transparent; color: rgba(249,244,237,.7);');\n  }\n  renderVals() {\n    const set = (v) => () => this.setState({ variant: v });\n    return {\n      theme: THEMES[this.state.variant] || THEMES.warm,\n      pickWarm: set('warm'), pickDunkel: set('dunkel'), pickDuo: set('duo'),\n      tabWarm: this.tab('warm'), tabDunkel: this.tab('dunkel'), tabDuo: this.tab('duo')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
